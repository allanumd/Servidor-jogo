function closeSk(){spo=false;lch.visible=true;lg.visible=true;lch.position.x=-1.45;$('sp').style.display='none';$('lobby').style.display='flex';lg.position.x=0}
let spinning=false,segs=[];
function wpick(){let t=0;for(const id of ALL)t+=WT(id);let r=R()*t;for(const id of ALL){r-=WT(id);if(r<=0)return id}return ALL[0]}
function newSegs(prize){segs=prize?[prize]:[];if(!segs.includes('char:classico'))segs.push('char:classico');const pool=ALL.filter(i=>!segs.includes(i));while(segs.length<8)segs.push(pool.splice((R()*pool.length)|0,1)[0]);
for(let i=segs.length-1;i>0;i--){const j=(R()*(i+1))|0;[segs[i],segs[j]]=[segs[j],segs[i]]}}
function drawWheel(){const x=$('wh').getContext('2d'),n=segs.length,a=2*PI/n;x.clearRect(0,0,400,400);
for(let i=0;i<n;i++){const[w,t]=segs[i].split(':'),th=TT(segs[i]),lum=(th.c>>16&255)*.299+(th.c>>8&255)*.587+(th.c&255)*.114;
x.beginPath();x.moveTo(200,200);x.arc(200,200,190,-PI/2+i*a,-PI/2+(i+1)*a);x.closePath();x.fillStyle=hex(th.c);x.fill();x.strokeStyle='#0009';x.lineWidth=3;x.stroke();
x.save();x.translate(200,200);x.rotate(-PI/2+(i+.5)*a);x.textAlign='right';x.textBaseline='middle';x.fillStyle=lum>140?'#111':'#fff';
x.font='bold 24px system-ui,sans-serif';x.fillText(th.n,166,-9);x.font='bold 16px system-ui,sans-serif';x.fillText(SN[w],166,13);
x.fillStyle=RC[th.r];x.fillRect(172,-9,12,18);x.strokeStyle='#000a';x.lineWidth=1.5;x.strokeRect(172,-9,12,18);x.restore()}
x.beginPath();x.arc(200,200,192,0,2*PI);x.strokeStyle='#ffb82b';x.lineWidth=8;x.stroke();
x.beginPath();x.arc(200,200,26,0,2*PI);x.fillStyle='#14161c';x.fill();x.strokeStyle='#ffb82b';x.lineWidth=5;x.stroke()}
function openRl(){$('lobby').style.display='none';$('rl').style.display='flex';newSegs();drawWheel();const wh=$('wh');wh.style.transition='none';wh.style.transform='rotate(0deg)';
$('rres').innerHTML='';$('spin').textContent='GIRAR · '+COST+' 🪙';upCoins()}
function closeRl(){if(spinning)return;$('rl').style.display='none';$('lobby').style.display='flex'}
function spin(){if(spinning)return;const r=$('rres');
if(coins<COST){r.innerHTML='Moedas insuficientes!<br>Jogue partidas para ganhar 🪙';return}
spinning=true;$('spin').disabled=true;r.innerHTML='';
coins-=COST;const prize=wpick(),dup=!!owned[prize];if(dup)coins+=DUP;else owned[prize]=true;save();upCoins(coins-(dup?DUP:0));
newSegs(prize);drawWheel();const idx=segs.indexOf(prize),a=360/segs.length,wh=$('wh');
wh.style.transition='none';wh.style.transform='rotate(0deg)';void wh.offsetWidth;
wh.style.transition='transform 4.6s cubic-bezier(.12,.7,.08,1)';wh.style.transform='rotate('+(360*6+360-(idx+.5)*a+(R()-.5)*a*.7)+'deg)';
setTimeout(()=>{spinning=false;$('spin').disabled=false;upCoins();const[w,t]=prize.split(':'),th=TT(prize);
r.innerHTML='<div class="pz" style="border-color:'+RC[th.r]+'"><small style="color:'+RC[th.r]+'">'+RN[th.r]+'</small><b>'+(w=='char'?'Personagem':WP[w].n)+' · '+th.n+'</b>'+(dup?'Repetida! +'+DUP+' 🪙':'Nova skin!')+'</div>';
const b=document.createElement('button');b.className='sb';b.textContent=eq[w]===t?'EQUIPADA':'EQUIPAR';b.disabled=eq[w]===t;
b.onclick=()=>{equip(w,t);b.textContent='EQUIPADA';b.disabled=true};r.appendChild(b)},4800)}
function applyHud(){document.body.className='h'+hcfg.st;document.body.style.setProperty('--bs',hcfg.sz);document.body.style.setProperty('--bo',hcfg.op)}
function renderHd(){const S=$('hst');S.innerHTML='';['Clássico','Neon','Minimal'].forEach((n,i)=>{const b=document.createElement('button');b.className='tb'+(hcfg.st==i?' on':'');b.textContent=n;b.onclick=()=>{hcfg.st=i;applyHud();save();renderHd()};S.appendChild(b)});
$('hsz').value=hcfg.sz;$('hop').value=hcfg.op}
function openHd(){lch.visible=false;$('lobby').style.display='none';$('hd').style.display='flex';$('hud').style.display='block';
$('wn').textContent=WP[sel].n;$('ma').textContent=WP[sel].mag+' / '+WP[sel].mag*2;$('zt').textContent='Zona: 58m';renderHd()}
function closeHd(){lch.visible=true;$('hd').style.display='none';$('hud').style.display='none';$('lobby').style.display='flex'}
$('hsz').oninput=e=>{hcfg.sz=+e.target.value;applyHud();save()};$('hop').oninput=e=>{hcfg.op=+e.target.value;applyHud();save()};
$('bhd').onclick=openHd;$('hdx').onclick=closeHd;applyHud();
$('bsk').onclick=openSk;$('spx').onclick=closeSk;$('bro').onclick=openRl;$('rlx').onclick=closeRl;$('spin').onclick=spin;upCoins();
// controles
const jb=$('jb'),jk=$('jk');let jid=null,jox=0,joy=0,fid=null,lid=null,lx=0,ly=0;
function look(dx,dy){const s=ads?.0032:.0055;yaw-=dx*s;pitch-=dy*s;if(firing&&dy<-1.5)pull=.6}
addEventListener('pointerdown',e=>{aud();if(!playing)return;const t=e.target;if(t.id=='snd'){muted=!muted;t.textContent=muted?'🔇':'🔊';if(MG)MG.gain.value=muted?0:.6;return}
if(t.id=='fire'){fid=e.pointerId;firing=true;lx=e.clientX;ly=e.clientY;t.classList.add('on');return}
const b=t.closest&&t.closest('.btn');if(b){if(b.id=='jump')jumpReq=true;else if(b.id=='rld')reload();else if(b.id=='aim'){ads=!ads;b.classList.toggle('on',ads)}else if(b.id=='run'){running=!running;b.classList.toggle('on',running)}return}
if(e.clientX<innerWidth*.45&&jid===null){jid=e.pointerId;jox=e.clientX;joy=e.clientY;for(const q of[jb,jk]){q.style.display='block'}
jb.style.left=jox-60+'px';jb.style.top=joy-60+'px';jk.style.left=jox-27+'px';jk.style.top=joy-27+'px'}
else if(lid===null){lid=e.pointerId;lx=e.clientX;ly=e.clientY}});
addEventListener('pointermove',e=>{if(e.pointerId===jid){let dx=e.clientX-jox,dy=e.clientY-joy;const l=M.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;jk.style.left=jox+dx-27+'px';jk.style.top=joy+dy-27+'px'}
else if(e.pointerId===fid||e.pointerId===lid){look(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY}});
function up(e){aud();if(e.pointerId===jid){jid=null;jx=jy=0;jb.style.display=jk.style.display='none'}
if(e.pointerId===fid){fid=null;firing=false;$('fire').classList.remove('on')}if(e.pointerId===lid)lid=null}
addEventListener('pointerup',up);addEventListener('pointercancel',up);addEventListener('contextmenu',e=>e.preventDefault());
let fa=0,fc=0;const clock=new W.Clock();
function loop(){requestAnimationFrame(loop);const dt=M.min(.05,clock.getDelta());
if(playing){step(dt);ren.render(scene,cam)}else{lg.rotation.y+=dt*.8;if(lch)lch.rotation.y+=dt*.5;ren.render(ls,lcam)}
fa+=dt;fc++;if(fa>2){const f=fc/fa;fa=fc=0;if(f<42&&pr>.9){pr-=.25;rs()}else if(f>58&&pr<cap){pr=M.min(cap,pr+.25);rs()}}}
loop();
</script></body></html>
